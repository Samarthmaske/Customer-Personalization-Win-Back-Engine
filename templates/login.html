<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChurnEngine | Unified Analytics Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-body">
    <div class="container d-flex flex-column align-items-center">
        <div id="js-health" class="position-absolute" style="top:12px; right:12px; z-index:1100;">
            <span class="badge bg-secondary" id="js-health-badge">JS: unknown</span>
        </div>
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <h1 class="text-white brand-font fw-bold d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-chart-line text-purple me-3 animate-pulse"></i>
                <span>Churn<span class="text-cyan">Engine</span></span>
            </h1>
            <p class="text-secondary-dark mb-0">E-Commerce Forecasting & Win-Back Platform</p>
        </div>

        <!-- Glassmorphism Auth Panel -->
        <div class="card login-card glass-panel text-white">
            <h3 class="brand-font fw-semibold mb-3 text-center">System Authentication</h3>

            <div class="d-flex justify-content-center mb-3 auth-tab-group">
                <button id="tab-login" type="button" class="btn btn-sm auth-tab active me-2">Sign In</button>
                <button id="tab-register" type="button" class="btn btn-sm auth-tab">Create Account</button>
            </div>

            <div id="alert-container"></div>

            <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
                <div id="registration-toast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">
                            <i class="fa-solid fa-circle-check me-2"></i> Account created successfully. Welcome aboard!
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            </div>

            <div id="login-panel">
                <h4 class="text-center mb-3">Sign In</h4>
                <form id="login-form" action="{{ url_for('login_page') }}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary-dark">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary-subtle text-secondary-dark">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary-dark">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary-subtle text-secondary-dark">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary-dark">Quick Login Presets (Demo Mode)</label>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outline-info btn-sm text-start demo-preset-btn" data-user="admin" data-pass="admin123">
                                <i class="fa-solid fa-user-shield me-2"></i> <strong>Manager:</strong> admin / admin123
                            </button>
                            <button type="button" class="btn btn-outline-warning btn-sm text-start demo-preset-btn" data-user="customer" data-pass="customer123">
                                <i class="fa-solid fa-user-injured me-2"></i> <strong>High-Risk:</strong> customer / customer123
                            </button>
                            <button type="button" class="btn btn-outline-success btn-sm text-start demo-preset-btn" data-user="loyal" data-pass="customer123">
                                <i class="fa-solid fa-user-check me-2"></i> <strong>Low-Risk:</strong> loyal / customer123
                            </button>
                        </div>
                    </div>

                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-glow-purple btn-lg d-flex align-items-center justify-content-center">
                            <span>Authenticate</span>
                            <i class="fa-solid fa-arrow-right-to-bracket ms-2" id="login-icon"></i>
                        </button>
                    </div>
                </form>
            </div>

            <div id="register-panel" class="d-none">
                <h4 class="text-center mb-3">Create Account</h4>
                <form id="register-form" action="{{ url_for('register_user') }}" method="post">
                    <noscript>
                        <div class="alert alert-warning mt-2">JavaScript is disabled — the form will submit normally. If you experience layout issues, please enable JavaScript or refresh the page.</div>
                    </noscript>
                    <div class="mb-3">
                        <label for="register-name" class="form-label text-secondary-dark">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary-subtle text-secondary-dark">
                                <i class="fa-solid fa-user-plus"></i>
                            </span>
                            <input type="text" class="form-control" id="register-name" name="name" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="register-email" class="form-label text-secondary-dark">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary-subtle text-secondary-dark">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control" id="register-email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="register-username" class="form-label text-secondary-dark">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary-subtle text-secondary-dark">
                                <i class="fa-solid fa-id-badge"></i>
                            </span>
                            <input type="text" class="form-control" id="register-username" name="username" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="register-password" class="form-label text-secondary-dark">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary-subtle text-secondary-dark">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="register-password" name="password" placeholder="Create password" required>
                        </div>
                        <div id="password-hint" class="form-text text-secondary-dark">Use at least 8 characters with letters and numbers.</div>
                    </div>

                    <div class="mb-4">
                        <label for="register-confirm-password" class="form-label text-secondary-dark">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary-subtle text-secondary-dark">
                                <i class="fa-solid fa-check"></i>
                            </span>
                            <input type="password" class="form-control" id="register-confirm-password" name="confirm_password" placeholder="Confirm password" required>
                        </div>
                    </div>

                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-glow-cyan btn-lg d-flex align-items-center justify-content-center">
                            <span>Create Account</span>
                            <i class="fa-solid fa-user-plus ms-2" id="register-icon"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-5">
            <span class="text-secondary-dark font-monospace" style="font-size: 0.8rem;">
                B.Tech Final Year Project &copy; 2026 | Patil, Maske, Gurav
            </span>
        </div>
    </div>

    <!-- jQuery Library (load before scripts that use it) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login Logic -->
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
